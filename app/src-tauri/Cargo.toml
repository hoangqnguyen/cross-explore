[package]
name = "cross-explore"
description = "Cross Explore: a fast, live, cross-platform file explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cross_explore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cx-core.workspace = true
cx-local.workspace = true
cx-transfer = { path = "../../crates/cx-transfer" }
cx-archive = { path = "../../crates/cx-archive" }
cx-search = { path = "../../crates/cx-search" }
cx-thumbs = { path = "../../crates/cx-thumbs" }
cx-discovery = { path = "../../crates/cx-discovery" }
cx-peer = { path = "../../crates/cx-peer" }
cx-smb = { path = "../../crates/cx-smb" }
cx-webdav = { path = "../../crates/cx-webdav" }
cx-sftp = { path = "../../crates/cx-sftp" }
cx-ftp = { path = "../../crates/cx-ftp" }
cx-term = { path = "../../crates/cx-term" }
cx-s3 = { path = "../../crates/cx-s3" }
cx-cloud = { path = "../../crates/cx-cloud" }
tokio-util = "0.7"
mime_guess = "2"
percent-encoding = "2"
blake3 = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
sysinfo.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", windows, all(target_os = "linux", not(target_os = "android"))))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows, all(target_os = "linux", not(target_os = "android"))))'.dependencies.clipboard-rs]
version = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"
plist = "1"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
block2 = "0.6"

[target.'cfg(any(target_os = "macos", windows, all(target_os = "linux", not(target_os = "android"))))'.dependencies.tauri-plugin-drag]
version = "2"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }

[dev-dependencies]
tempfile.workspace = true
