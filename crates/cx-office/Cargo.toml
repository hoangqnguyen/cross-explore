[package]
name = "cx-office"
description = "Office document previews for Cross Explore: Word, Excel, PowerPoint, OpenDocument, RTF and CSV as sanitized HTML, or PDF through LibreOffice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cx-core.workspace = true
serde.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["io-util", "fs", "rt", "sync"] }
tempfile.workspace = true
# Pure-Rust parsers only, so iOS/Android/Windows cross-builds need no C toolchain.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
calamine = "0.36"
cfb = "0.7"
encoding_rs = "0.8"
base64 = "0.22"

[dev-dependencies]
cx-local.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "fs"] }
tempfile.workspace = true
rust_xlsxwriter = { version = "0.99", default-features = false }
