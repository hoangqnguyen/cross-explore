[package]
name = "cx-cloud"
description = "Cloud storage providers for Cross Explore: Google Drive, Dropbox and OneDrive over their HTTP APIs (OAuth 2.0 + PKCE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cx-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "sync"] }
url.workspace = true
tempfile.workspace = true
# Same HTTP/TLS stack as cx-webdav and cx-s3 (rustls).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"
httpdate = "1"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time", "net"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
