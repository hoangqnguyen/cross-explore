[package]
name = "cx-discovery"
description = "Background discovery of nearby devices and file services (mDNS, Tailscale, SSDP, WS-Discovery, port probes) for Cross Explore"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cx-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "process", "sync", "macros", "io-util"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
gethostname = "1"
percent-encoding = "2"
socket2 = "0.6"
if-addrs = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
