[package]
name = "cx-tui"
description = "Cross Explore in the terminal: dual-pane, keyboard-first, live file explorer on cx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cx_tui"
path = "src/lib.rs"

[[bin]]
name = "cx-tui"
path = "src/main.rs"

[dependencies]
cx-core.workspace = true
cx-engine = { path = "../cx-engine" }
cx-transfer = { path = "../cx-transfer" }
cx-search = { path = "../cx-search" }
cx-archive = { path = "../cx-archive" }
cx-discovery = { path = "../cx-discovery" }
cx-peer = { path = "../cx-peer" }
cx-term = { path = "../cx-term" }
cx-thumbs = { path = "../cx-thumbs" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
dirs.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
unicode-width = "0.2"
regex = "1"
similar = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile.workspace = true
