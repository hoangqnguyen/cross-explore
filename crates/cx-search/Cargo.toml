[package]
name = "cx-search"
description = "Recursive name search, content grep and fuzzy ranking for Cross Explore"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cx-core.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util"] }
regex = "1.12"
globset = "0.4.18"
unicode-normalization = "0.1.25"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"

[dev-dependencies]
cx-local.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
