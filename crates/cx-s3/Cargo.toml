[package]
name = "cx-s3"
description = "S3-compatible object storage provider for Cross Explore (reqwest + SigV4)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cx-core.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util"] }
url.workspace = true
# Same HTTP/TLS stack as cx-webdav (rustls), so S3 adds no second client.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
quick-xml = "0.42"
httpdate = "1"
hmac = "0.13"
sha2 = "0.11"
md-5 = "0.11"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
cx-local.workspace = true
