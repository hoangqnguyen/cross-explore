[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cx-core = { path = "crates/cx-core" }
cx-local = { path = "crates/cx-local" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
notify = "8.2"
trash = "5"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Keep function names (not debug info): crash reports then name the code.
strip = "debuginfo"
# Unwind, don't abort: a bug in one background task fails that task
# (a thumbnail, a listing) instead of closing the whole app.
panic = "unwind"
